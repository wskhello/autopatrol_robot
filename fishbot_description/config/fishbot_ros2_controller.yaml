controller_manager: #controller_manager 主节点配置
  ros__parameters:  #参数配置
    update_rate: 100    # 控制器管理器的更新频率（Hz），即每秒调用一次 update() 的次数
    use_sim_time: true  # 是否使用仿真时间（/clock 话题），通常在 Gazebo 等仿真环境中设为 true

     #-------- 第一个控制器：关节状态广播器 --------
    fishbot_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster   # 插件类型：负责从硬件接口读取关节的 position/velocity/effort
                                                            # 并发布到 /joint_states 话题（sensor_msgs/JointState）
    #  # -------- 第二个控制器：力（力矩）控制器 --------                                                          
    # robot_effort_controller:
    #   type: effort_controllers/JointGroupEffortController  #向一组关节下发 effort（力矩）指令
    
     # -------- 第三个控制器：两轮差速控制器 --------     
    fishbot_diff_drive_controller:
      type: diff_drive_controller/DiffDriveController #差速控制器插件类型
      



