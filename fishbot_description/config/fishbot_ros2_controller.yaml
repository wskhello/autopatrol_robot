# fishbot_diff_drive_controller 控制器自身的参数
fishbot_diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]  # 左轮关节名列表
    right_wheel_names: ["right_wheel_joint"] # 右轮关节名列表
    wheel_separation: 0.20                     # 两轮之间的距离（米）
    wheel_radius: 0.032                        # 轮子半径（米）

    wheel_separation_multiplier: 1.0           # 两轮间距的乘数因子，用于调整轮间距
    left_wheel_radius_multiplier: 1.0          # 左轮半径的乘数因子，用于调整左轮半径
    right_wheel_radius_multiplier: 1.0         # 右轮半径的乘数因子，用于调整右轮半径

    publish_rate: 50.0                       # 发布里程计话题的频率（Hz）
    odom_frame_id: "odom"                    # 里程计话题的坐标系 ID
    base_frame_id: "base_footprint"          # 机器人底盘的坐标系

    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.0] # 里程计位姿协方差矩阵的对角线元素
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.001] # 里程计速度协方差矩阵的对角线元素

    open_loop: true                          # 是否使用开环控制（不依赖里程计反馈）

    cmd_vel_timeout: 0.5                      # cmd_vel 指令超时时间（秒）
    enable_odom_tf: true                      # 是否发布里程计的 TF
    use_stamped_vel: false                    # 是否使用带时间戳的速度指令
    



      